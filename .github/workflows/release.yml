name: Build IPK Packages

# Only OpenWrt 24.10 (opkg / .ipk) is built here.
# SNAPSHOT uses the apk format, so it is intentionally not part of this workflow.
#
# Releases are created automatically: every successful push build publishes /
# refreshes the rolling "latest" Release. Pushing a v* tag publishes a separate
# version Release. A single-architecture manual run never overwrites "latest"
# unless "publish = always" is chosen explicitly.
#
# Builds are x86_64-only by default. The full architecture matrix is still
# available on demand by choosing "all" in a manual run.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build (all = every architecture)'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - all
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - arm_cortex-a7
          - arm_cortex-a9
          - mips_24kc
          - mipsel_24kc
          - riscv64_riscv64
      publish:
        description: 'Publish a Release (auto = only full builds)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - always
          - never
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

# Keep push and manual runs in separate groups so triggering a push build
# cannot cancel an in-progress single-architecture trial run.
concurrency:
  group: build-ipk-${{ github.event_name }}-${{ github.ref }}-${{ inputs.arch || 'auto' }}
  cancel-in-progress: true

env:
  SDK: openwrt-24.10
  FEEDNAME: packages_ci
  PACKAGES: luci-app-ddns-go

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            # Only real v* version tags count. The automatically created
            # "latest" / "latest-<arch>" rolling tags must not become versions.
            VERSION=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null \
                      || echo "dev-${GITHUB_SHA::7}")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  prepare:
    runs-on: ubuntu-latest
    outputs:
      arch-matrix: ${{ steps.matrix.outputs.arch-matrix }}
    steps:
      - name: Select architectures
        id: matrix
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SELECTED: ${{ inputs.arch || '' }}
          # Pushes (and therefore automatic Releases) build x86_64 only.
          SINGLE_ARCHES: '["x86_64"]'
          # "all" in a manual run is the opt-in path for the full matrix.
          ALL_ARCHES: '["aarch64_cortex-a53","aarch64_cortex-a72","aarch64_cortex-a76","aarch64_generic","arm_cortex-a7","arm_cortex-a9","mips_24kc","mipsel_24kc","riscv64_riscv64","x86_64"]'
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SELECTED" = "all" ]; then
            echo "arch-matrix=$ALL_ARCHES" >> "$GITHUB_OUTPUT"
            echo "Manual run: building all architectures"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$SELECTED" ]; then
            echo "arch-matrix=[\"$SELECTED\"]" >> "$GITHUB_OUTPUT"
            echo "Manual run: building only $SELECTED"
          else
            echo "arch-matrix=$SINGLE_ARCHES" >> "$GITHUB_OUTPUT"
            echo "Push: building x86_64 only (automatic Release)"
          fi

  build:
    name: ipk / ${{ matrix.arch }}
    needs: [get-version, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arch-matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with OpenWrt 24.10 SDK
        uses: sirpdboy/gh-action-sdk@go1.26
        env:
          ARCH: ${{ matrix.arch }}-${{ env.SDK }}
          FEEDNAME: ${{ env.FEEDNAME }}
          PACKAGES: ${{ env.PACKAGES }}
          NO_REFRESH_CHECK: 'true'

      - name: Collect .ipk files and create tar.gz
        id: pack
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SDK: ${{ env.SDK }}
        run: |
          set -euo pipefail

          echo "=== Files produced by the SDK ==="
          find bin/packages -type f -print | sort || true

          mkdir -p ipk-out
          # Prefer this architecture's own directory so packages built for a
          # different target can never leak into this archive. The riscv64 SDK
          # writes to riscv64_generic instead of riscv64_riscv64, so fall back
          # to the whole tree only when the expected directory has no .ipk.
          PKG_ROOT="bin/packages/$ARCH"
          if [ ! -d "$PKG_ROOT" ] || \
             ! find "$PKG_ROOT" -type f -name '*ddns-go*.ipk' -print -quit | grep -q .; then
            echo "::warning::$PKG_ROOT has no .ipk, falling back to bin/packages"
            PKG_ROOT="bin/packages"
          fi
          echo "Collecting from: $PKG_ROOT"

          # Only this project's .ipk packages are kept.
          while IFS= read -r -d '' f; do
            cp -f "$f" ipk-out/
          done < <(find "$PKG_ROOT" -type f -name '*ddns-go*.ipk' -print0)

          # Hard guarantee: the archive can only ever contain .ipk files.
          find ipk-out -type f ! -name '*.ipk' -delete

          COUNT=$(find ipk-out -maxdepth 1 -type f -name '*.ipk' | wc -l)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No .ipk files were produced for $ARCH"
            exit 1
          fi

          APK_COUNT=$(find bin/packages -type f -name '*.apk' | wc -l)
          echo "APK files produced by SDK (intentionally discarded): $APK_COUNT"
          echo "=== Collected .ipk files ($COUNT) ==="
          ls -lh ipk-out
          sha256sum ipk-out/*.ipk

          ARCHIVE="${SDK}-${ARCH}.tar.gz"
          tar -zcvf "$ARCHIVE" -C ipk-out .
          echo "=== Archive contents ==="
          tar -tzf "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload .ipk files
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ env.SDK }}-${{ matrix.arch }}
          path: ipk-out/*.ipk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ env.SDK }}-${{ matrix.arch }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: [get-version, build]
    # A single upload job avoids the previous race where every matrix job
    # replaced the release assets of all the others.
    # Push builds (x86_64 only) publish automatically. A manual single-arch
    # trial never overwrites "latest" unless publish=always was chosen.
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        inputs.publish != 'never' &&
        (github.event_name != 'workflow_dispatch' ||
         inputs.publish == 'always' ||
         inputs.arch == 'all' ||
         inputs.arch == '')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release target
        id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SELECTED: ${{ inputs.arch || '' }}
          PUBLISH: ${{ inputs.publish || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
            NAME="OpenWrt IPK Packages $REF_NAME"
            PRERELEASE=false
            LABEL="Version release"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH" = "always" ] \
               && [ -n "$SELECTED" ] && [ "$SELECTED" != "all" ]; then
            # Keep a forced single-architecture release away from "latest".
            TAG="latest-$SELECTED"
            NAME="OpenWrt IPK Packages ($SELECTED trial build)"
            PRERELEASE=true
            LABEL="Single-architecture trial"
          else
            TAG="latest"
            NAME="OpenWrt IPK Packages (latest build)"
            PRERELEASE=false
            LABEL="Rolling automatic build"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Release target: tag=$TAG, name=$NAME, prerelease=$PRERELEASE"

      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Download all standalone .ipk files
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: ipk-dist
          merge-multiple: true

      - name: Verify release payload
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          # Keep the two download steps in separate directories so neither can
          # clear the files produced by the other. GitHub replaces "~" in a
          # release asset name with "."; normalise it ourselves so that
          # replacesArtifacts can match and replace an existing asset instead
          # of hitting a name conflict (the i18n package version contains "~").
          for f in ipk-dist/*.ipk; do
            base=${f##*/}
            cp -f "$f" "dist/$(printf '%s' "$base" | tr '~' '.')"
          done
          ARCHIVES=$(find dist -type f -name '*.tar.gz' | wc -l)
          IPKS=$(find dist -type f -name '*.ipk' | wc -l)
          OTHERS=$(find dist -type f ! -name '*.tar.gz' ! -name '*.ipk' | wc -l)
          echo "tar.gz archives: $ARCHIVES, standalone .ipk files: $IPKS, other files: $OTHERS"
          test "$ARCHIVES" -gt 0
          test "$IPKS" -gt 0
          test "$OTHERS" -eq 0
          echo "archive_count=$ARCHIVES" >> "$GITHUB_OUTPUT"
          echo "ipk_count=$IPKS" >> "$GITHUB_OUTPUT"
          for f in dist/*.tar.gz; do
            echo "--- $f"
            tar -tzf "$f"
            # The archive is created with "tar -C ipk-out .", so it always has
            # a bare "." directory entry. Ignore directory entries ("./", "x/")
            # and empty lines; everything else must be an .ipk file.
            BAD=$(tar -tzf "$f" | grep -vE '\.ipk$|/+$|^(\.|\./)?$' || true)
            if [ -n "$BAD" ]; then
              echo "::error::$f contains non-ipk files: $BAD"
              exit 1
            fi
          done
          echo "=== Standalone .ipk files ==="
          ls -lh dist/*.ipk

      - name: Generate release notes
        id: release_notes
        shell: bash
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          LABEL: ${{ steps.meta.outputs.label }}
          ARCHIVE_COUNT: ${{ steps.verify.outputs.archive_count }}
          IPK_COUNT: ${{ steps.verify.outputs.ipk_count }}
        run: |
          set -euo pipefail
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
          {
            echo "# OpenWrt IPK Packages $VERSION"
            echo
            echo "> $LABEL - generated automatically by the Build IPK Packages workflow."
            echo "> Commit \`$GITHUB_SHA\` | run #$GITHUB_RUN_NUMBER | $BUILD_TIME | $ARCHIVE_COUNT architecture archives."
            echo
            echo "- SDK: OpenWrt 24.10 (opkg / \`.ipk\` only)"
            echo "- Every archive contains \`.ipk\` files only: no \`.apk\`, no firmware images."
            echo
            echo "## Package Overview"
            echo
            echo "| Package | Version |"
            echo "|---------|---------|"
            for dir in ddns-go luci-app-ddns-go; do
              name=$(grep -m1 '^PKG_NAME' "$dir/Makefile" | cut -d'=' -f2 | tr -d '[:space:]')
              ver=$(grep -m1 '^PKG_VERSION' "$dir/Makefile" | cut -d'=' -f2 | tr -d '[:space:]')
              rel=$(grep -m1 '^PKG_RELEASE' "$dir/Makefile" | cut -d'=' -f2 | tr -d '[:space:]')
              echo "| \`$name\` | \`$ver-$rel\` |"
            done
            echo
            echo "## Archives (one per architecture)"
            echo
            for f in dist/*.tar.gz; do
              echo "- \`$(basename "$f")\`"
            done
            echo
            echo "## Standalone .ipk packages ($IPK_COUNT)"
            echo
            for f in dist/*.ipk; do
              echo "- \`$(basename "$f")\`"
            done
            echo
            echo "## Changelog"
            echo
            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since $PREV_TAG:"
              echo
              git log --pretty=format:'- %s (%h)' "$PREV_TAG"..HEAD || true
            else
              git log --pretty=format:'- %s (%h)' -10 || true
            fi
            echo
            echo
            echo "## Notes"
            echo
            echo "- Pick the archive matching your router's architecture."
            echo "- Install with \`opkg install *.ipk\` (OpenWrt 24.10)."
            echo
            echo "## Credits"
            echo
            echo "- [jeessy2](https://github.com/jeessy2/ddns-go) - Original ddns-go project"
            echo "- [sirpdboy](https://github.com/sirpdboy) - OpenWRT package maintainer"
          } > release-notes.md

          {
            echo "notes<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Upload archives and .ipk files to Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.meta.outputs.name }}
          tag: ${{ steps.meta.outputs.tag }}
          # The action creates the tag when it is missing, but needs an
          # explicit commit reference in that case ("latest" is auto-created).
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          # Both the per-architecture tar.gz archives AND the bare .ipk files
          # must be downloadable directly from the Releases page.
          artifacts: "dist/*.tar.gz,dist/*.ipk"
          body: ${{ steps.release_notes.outputs.notes }}
