config basic 'config'
        option enabled '0'
        option logger '1'
        option port '9876'
        option time '300'
        option ctimes '5'
        option skipverify '0'
        option delay '0'
        option dns '223.5.5.5'

# Alidns (Aliyun DNS) line / extended options.
# These are applied to the domain names in ddns-go-config.yaml by
# /usr/libexec/ddns-go-alidns. Disabled by default, so an existing
# ddns-go setup keeps working unchanged.
config alidns 'alidns'
        option enabled '0'
        option line 'default'
        option line_code ''
        option record_id ''
        option lang ''
        option extra_params ''
        option apply_to 'all'
        option domain ''
        option custom_line_name ''
        option ip_segments ''
